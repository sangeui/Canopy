# v로 시작하는 태그를 올리면 Canopy를 빌드해 DMG로 묶고 GitHub Releases에 올린다.
#   git tag v0.2.0 && git push origin v0.2.0
# Developer ID 인증서와 공증 정보는 저장소 Secrets에 둔다(docs/RELEASING.md). 없으면 임시 서명으로 올리고 노트에 적는다.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스할 태그 (예: v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 버전
        run: |
          TAG="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          swift --version

      - name: 테스트
        run: swift test

      - name: 서명 인증서 가져오기
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: 앱 만들기
        run: ./make-app.sh --universal --version "$VERSION"

      - name: DMG 만들기 (서명·공증)
        run: ./scripts/make-dmg.sh "$VERSION"

      - name: 릴리스 노트 만들기
        run: ./scripts/make-release-notes.sh "$VERSION" "$RUNNER_TEMP/notes.md"

      - name: GitHub Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "build/Canopy-$VERSION.dmg" "build/Canopy-$VERSION.dmg.sha256" \
              --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" \
              "build/Canopy-$VERSION.dmg" "build/Canopy-$VERSION.dmg.sha256" \
              --title "Canopy $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag
          fi

      - name: 임시 키체인 지우기
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
